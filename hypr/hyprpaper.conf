# ── HYPRPAPER ─────────────────────────────────────────────────────
# Place your wallpaper at the path below, or change the path.
# Supports: jpg, png, webp

preload = ~/Pictures/wallpapers/wall.png

# Set per monitor — use `hyprctl monitors` for your monitor name
# Or use the wildcard to apply to all monitors
wallpaper = ,~/Pictures/wallpapers/wall.png

# Uncomment to allow IPC control (e.g. change wallpaper at runtime)
# ipc = on
