# ██║  ██║   ██║   ██║     ██║  ██║███████╗██║  ██║██║ ╚████║██████╔╝
# ╚═╝  ╚═╝   ╚═╝   ╚═╝     ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝╚═╝  ╚═══╝╚═════╝
# retr0sity_dots — Minimal / Dev / Sysadmin — 1080p single monitor
# ------------------------------------------------------------------

# ── MONITOR ───────────────────────────────────────────────────────
monitor=eDP-1,1920x1080@60,0x0,1

# ── AUTOSTART ─────────────────────────────────────────────────────
exec-once = waybar
exec-once = dunst
exec-once = swaybg -i /home/hotzas/Pictures/wall.png -m fill
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dunstctl history-clear
exec-once = blueman-applet
exec-once = swayosd-server

# ── ENVIRONMENT ───────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = GTK_THEME,Adwaita:dark
env = COLOR_SCHEME,prefer-dark
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_RENDERER,vulkan
env = AMD_VULKAN_ICD,RADV

# ── INPUT ─────────────────────────────────────────────────────────
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = false
        disable_while_typing = true
        tap-to-click = true
    }
}

# ── GENERAL ───────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border   = rgba(89b4faff)
    col.inactive_border = rgba(313244ff)

    layout = master
    resize_on_border = true
    allow_tearing = false
}

# ── DECORATION ────────────────────────────────────────────────────
decoration {
    rounding = 6

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = false
        range = 8
        render_power = 2
        color = rgba(1e1e2ecc)
    }

    inactive_opacity = 0.93
    active_opacity   = 1.0
}

# ── ANIMATIONS ────────────────────────────────────────────────────
animations {
    enabled = true

    bezier = snappy,    0.25, 1,   0.5,  1
    bezier = smooth,    0.4,  0,   0.2,  1
    bezier = overshoot, 0.05, 0.9, 0.1,  1.05

    animation = windows,     1, 4, snappy,  slide
    animation = windowsOut,  1, 3, smooth,  slide
    animation = border,      1, 8, smooth
    animation = borderangle, 1, 8, smooth
    animation = fade,        1, 5, smooth
    animation = workspaces,  1, 4, snappy,  slidevert
}

# ── LAYOUTS ───────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = slave
    mfact = 0.5
}

# ── MISC ──────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
}

# ── WINDOW RULES ──────────────────────────────────────────────────
windowrule = match:class org.pulseaudio.pavucontrol,  float on
windowrule = match:class nm-connection-editor,         float on
windowrule = match:class blueman-manager,              float on
windowrule = match:title File Operation Progress,      float on
windowrule = match:class xwaylandvideobridge, opacity 0.0 override 0.0 override
windowrule = match:class xwaylandvideobridge, no_anim on
windowrule = match:class xwaylandvideobridge, float on
windowrule = match:class kitty, match:fullscreen 1, rounding 0

# ── KEYBINDS ──────────────────────────────────────────────────────
$mod = SUPER

# ── Core ──
bind = $mod,       Return,  exec, kitty
bind = $mod,       T,       exec, kitty
bind = $mod,       Q,       killactive
bind = $mod SHIFT, Q,       exit
bind = $mod,       F,       fullscreen
bind = $mod SHIFT, F,       togglefloating
bind = $mod,       P,       pseudo

# ── Launcher / utilities ──
bind = $mod,       Space,   exec, wofi --show drun --gtk-dark
bind = $mod,       E,       exec, dolphin
bind = $mod,       B,       exec, firefox
bind = $mod,       N,       exec, kitty -e nmtui-dark
bind = $mod,       D,       exec, flatpak run com.discordapp.Discord
bind = $mod,       M,       exec, flatpak run com.spotify.Client
bind = $mod,       V,       exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, S,       exec, grimblast copy area
bind = $mod SHIFT, B,       exec, blueman-manager
bind = $mod,       End,     exec, systemctl poweroff
bind = $mod,       Delete,  exec, hyprctl dispatch exit 0

# ── Focus movement (vim keys) ──
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# ── Arrow key fallback ──
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# ── Move windows ──
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, layoutmsg, swapprev
bind = $mod SHIFT, J, layoutmsg, swapnext

# ── Resize mode ──
bind  = $mod, R, submap, resize
submap = resize
binde = , H,     resizeactive, -40 0
binde = , L,     resizeactive,  40 0
binde = , K,     resizeactive,  0 -40
binde = , J,     resizeactive,  0  40
binde = , left,  resizeactive, -40 0
binde = , right, resizeactive,  40 0
binde = , up,    resizeactive,  0 -40
binde = , down,  resizeactive,  0  40
bind  = , escape, submap, reset
submap = reset

# ── Workspaces ──
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# ── Move window to workspace ──
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ── Scratchpad ──
bind = $mod,       S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace,        special:magic

# ── Scroll through workspaces ──
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ── Mouse window ops ──
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Brightness ────────────────────────────────────────────────────
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# ── Media / audio ─────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
