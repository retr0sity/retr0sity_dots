# ── KITTY ─────────────────────────────────────────────────────────
# ~/.config/kitty/kitty.conf
# Minimal dark config — Catppuccin Mocha

# ── Font ──────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        12.0
adjust_line_height  2
adjust_column_width 0

# Ligatures on (great for code)
font_features JetBrainsMono-Regular +liga +calt
font_features JetBrainsMono-Bold    +liga +calt

# ── Cursor ────────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0
cursor_stop_blinking_after 0

# ── Scrollback ────────────────────────────────────────────────────
scrollback_lines       10000
scrollback_pager       less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Mouse ─────────────────────────────────────────────────────────
mouse_hide_wait        2.0
url_color              #89b4fa
url_style              curly
open_url_with          default
copy_on_select         yes

# ── Performance ───────────────────────────────────────────────────
repaint_delay          10
input_delay            3
sync_to_monitor        yes

# ── Terminal bell ─────────────────────────────────────────────────
enable_audio_bell      no
visual_bell_duration   0.0
window_alert_on_bell   yes

# ── Window layout ─────────────────────────────────────────────────
remember_window_size   yes
initial_window_width   920
initial_window_height  560

window_padding_width   10
window_padding_height  8

# Hide title bar decoration (Hyprland handles it)
hide_window_decorations yes

# ── Tab bar ───────────────────────────────────────────────────────
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    slanted
tab_title_template     "{index}: {title}"
active_tab_font_style  bold
inactive_tab_font_style normal

# ── Shell integration ─────────────────────────────────────────────
shell_integration      enabled

# ── Colorscheme — Catppuccin Mocha ────────────────────────────────
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

# URL underline on hover
url_color               #89B4FA

# Window border (inactive / active)
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# 16 terminal colors
# black, red, green, yellow, blue, magenta, cyan, white
color0   #45475A
color1   #F38BA8
color2   #A6E3A1
color3   #F9E2AF
color4   #89B4FA
color5   #F5C2E7
color6   #94E2D5
color7   #BAC2DE

# bright variants
color8   #585B70
color9   #F38BA8
color10  #A6E3A1
color11  #F9E2AF
color12  #89B4FA
color13  #F5C2E7
color14  #94E2D5
color15  #A6ADC8

# Mark colors
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# ── Keybinds ──────────────────────────────────────────────────────
# Kitty uses ctrl+shift as its modifier by default

# New tab / window
map ctrl+shift+t   new_tab_with_cwd
map ctrl+shift+n   new_os_window_with_cwd

# Tab navigation
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+1      goto_tab 1
map ctrl+shift+2      goto_tab 2
map ctrl+shift+3      goto_tab 3
map ctrl+shift+4      goto_tab 4

# Font size
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+0        change_font_size all 0

# Copy / paste
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard

# Scrollback in pager
map ctrl+shift+h        show_scrollback

# Reload config
map ctrl+shift+F5       load_config_file

# ── Misc ──────────────────────────────────────────────────────────
allow_remote_control     yes
listen_on                unix:/tmp/kitty
term                     xterm-256color
